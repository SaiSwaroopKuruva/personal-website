spring.application.name=finadvisor-api

# Render provides the PORT env var; default to 8080 for local runs
server.port=${PORT:8080}

# Postgres connection (local Docker Compose or Neon in deployed environments)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finadvisor}
spring.datasource.username=${DATABASE_USERNAME:finadvisor}
spring.datasource.password=${DATABASE_PASSWORD:finadvisor}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway migrations, not Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Must stay below V1: baseline-version defaults to 1, which equals our V1 migration
# and would make Flyway skip it (baselined) instead of actually running it.
spring.flyway.baseline-version=0

# JWT configuration - secret and expirations must be overridden via env vars in every deployed environment
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Local storage for profile photo uploads; served from /uploads/** (see WebMvcConfig)
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:2097152}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.finadvisor=INFO

# Mutual fund market-data provider - pluggable behind MutualFundDataProvider (finadvisor.provider).
# A real provider must never be enabled without a base-url/api-key configured via env vars; the
# built-in "demo" provider (in-database seed data only) is used otherwise.
mutualfund.provider.name=${MUTUAL_FUND_PROVIDER_NAME:demo}
mutualfund.provider.base-url=${MUTUAL_FUND_PROVIDER_URL:}
mutualfund.provider.api-key=${MUTUAL_FUND_PROVIDER_API_KEY:}
mutualfund.provider.timeout-ms=${MUTUAL_FUND_PROVIDER_TIMEOUT:5000}
mutualfund.provider.max-retries=${MUTUAL_FUND_PROVIDER_MAX_RETRIES:3}
mutualfund.provider.enabled=${MUTUAL_FUND_PROVIDER_ENABLED:false}
# Cron expression for the scheduled sync job; blank/"-" disables scheduling (manual/admin-triggered sync only)
mutualfund.sync.cron=${MUTUAL_FUND_SYNC_CRON:-}

# Financial calculator input guardrails (Part 19) - reject unreasonable values rather than clamp silently
mutualfund.calculator.max-amount=${MUTUAL_FUND_CALCULATOR_MAX_AMOUNT:100000000}
mutualfund.calculator.max-duration-years=${MUTUAL_FUND_CALCULATOR_MAX_DURATION_YEARS:50}
mutualfund.calculator.max-annual-return-percentage=${MUTUAL_FUND_CALCULATOR_MAX_RETURN_PERCENT:30}

# AMFI mutual fund NAV provider (Phase 3.5) - only used when mutualfund.provider.name=amfi.
# AMFI publishes latest NAV as a plain-text file; there is no documented per-scheme historical NAV REST API
# (see docs/financial-data-providers.md for the limitation writeup).
mutualfund.provider.amfi.nav-all-url=${AMFI_BASE_URL:https://www.amfiindia.com/spragmt/NAVAll.txt}
mutualfund.provider.amfi.cache-ttl-minutes=${AMFI_CACHE_TTL_MINUTES:60}

# Stock market-data provider (Phase 3.5). Leave "name" unset/blank to run without any stock provider -
# the stock APIs then return a clear 503 "provider unavailable" rather than a fabricated price.
stock.provider.name=${STOCK_DATA_PROVIDER:}
stock.provider.timeout-ms=${STOCK_PROVIDER_TIMEOUT:5000}
stock.provider.max-retries=${STOCK_PROVIDER_MAX_RETRIES:3}
# Must stay false unless a real provider is configured - gates the scheduled sync jobs
stock.provider.enabled=${STOCK_PROVIDER_ENABLED:false}

# Upstox read-only Analytics Token market-data provider (Part 5/6/7). Never expose UPSTOX_ANALYTICS_TOKEN
# to the frontend/GitHub Pages - it is read only by the backend and never returned in any API response.
stock.provider.upstox.api-base-url=${UPSTOX_API_BASE_URL:https://api.upstox.com}
stock.provider.upstox.analytics-token=${UPSTOX_ANALYTICS_TOKEN:}
stock.provider.upstox.cache-ttl-minutes=${UPSTOX_CACHE_TTL_MINUTES:30}

# Cron expressions for scheduled stock sync jobs; "-" (default) disables scheduling (manual/admin-triggered only)
stock.sync.instrument-cron=${STOCK_INSTRUMENT_SYNC_CRON:-}
stock.sync.eod-cron=${STOCK_EOD_SYNC_CRON:-}
