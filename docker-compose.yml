services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finadvisor
      POSTGRES_USER: finadvisor
      POSTGRES_PASSWORD: finadvisor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finadvisor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/finadvisor
      DATABASE_USERNAME: finadvisor
      DATABASE_PASSWORD: finadvisor
      # Local-only development secret. Every deployed environment must override this via Render env vars.
      JWT_SECRET: local-dev-secret-do-not-use-in-production-change-me-please
      JWT_ACCESS_TOKEN_EXPIRATION: "900000"
      JWT_REFRESH_TOKEN_EXPIRATION: "604800000"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  postgres-data:
