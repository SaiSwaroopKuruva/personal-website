name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Compile
        run: mvn -B -q compile

      - name: Run unit tests
        run: mvn -B -q test

      - name: Package application
        run: mvn -B -q package -DskipTests

      - name: Validate Dockerfile builds
        run: docker build -f ../../infrastructure/docker/api.Dockerfile -t backend-ci-validation .

  frontend-build:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://placeholder.onrender.com' }}

  deploy:
    name: Deploy to Render and GitHub Pages
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Requires an "owner" environment (Settings > Environments) with the repo owner
    # added under "Required reviewers" so deployment pauses for manual approval.
    environment:
      name: owner
      url: ${{ steps.deployment.outputs.page_url }}
    # `secrets` isn't allowed in a step's `if:` condition, so surface presence
    # checks as job-level env vars (env context can be used in step `if:`).
    env:
      RENDER_API_KEY_SET: ${{ secrets.RENDER_API_KEY != '' }}
      RENDER_SERVICE_ID_SET: ${{ secrets.RENDER_SERVICE_ID != '' }}
      RENDER_DEPLOY_HOOK_URL_SET: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      # Uses the Render API (not just the deploy hook) so we can poll the deploy
      # status and fail this job if Render's build/deploy fails.
      # Requires repo secrets: RENDER_API_KEY, RENDER_SERVICE_ID.
      - name: Deploy to Render and wait for status
        if: env.RENDER_API_KEY_SET == 'true' && env.RENDER_SERVICE_ID_SET == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          echo "Triggering Render deploy..."
          deploy_id=$(curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' | jq -r '.id')

          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "::error::Failed to trigger Render deploy or parse deploy id"
            exit 1
          fi
          echo "Render deploy id: $deploy_id"

          max_attempts=60 # ~20 minutes at 20s intervals
          for i in $(seq 1 "$max_attempts"); do
            status=$(curl -fsS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')

            echo "Attempt $i/$max_attempts: status=$status"

            case "$status" in
              live)
                echo "Render deploy succeeded."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Render deploy failed with status: $status"
                exit 1
                ;;
            esac

            sleep 20
          done

          echo "::error::Timed out waiting for Render deploy to finish"
          exit 1

      # Fallback for repos that only have the deploy hook configured; fires the
      # deploy but cannot report success/failure back to this workflow.
      - name: Trigger Render deploy hook (no status reporting)
        if: env.RENDER_API_KEY_SET == 'false' && env.RENDER_DEPLOY_HOOK_URL_SET == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json

      - name: Install dependencies
        working-directory: app/web
        run: npm ci

      - name: Build static site for GitHub Pages
        working-directory: app/web
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://placeholder.onrender.com' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
